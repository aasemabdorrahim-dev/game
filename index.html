<h4>مراحل كل جولة</h4><ol><li><b>السؤال:</b> يكتب كل لاعب تقديره سراً.</li><li><b>النتيجة:</b> كل 10% من نسبة قربك من الجواب الصحيح = جيش (الجواب الدقيق 10، وبلا إجابة 0). أسئلة السنوات تُقاس على مقياس مناسب. الأقرب جواباً يأخذ وسام الحكمة 🏅. وتختار عند البداية طريقة الإجابة: لوحة أرقام (الافتراضي) أو شريط سهل.</li><li><b>أدوار اللاعبين</b> بالتناوب، ولكل لاعب: توزيع ثم هجوم ثم إعادة تمركز.</li></ol>
