<style>

html,body{height:100%}
body{margin:0;padding:6px;box-sizing:border-box;background:var(--bg);color:var(--fg);font:14px/1.5 Tahoma,"Segoe UI",system-ui,sans-serif}
#app{display:grid;grid-template-columns:310px 1fr;grid-template-rows:auto auto minmax(0,1fr);gap:8px;height:100%}
.side{overflow:auto;min-height:0;grid-column:1;grid-row:3}.mapw{min-height:0;grid-column:2;grid-row:1/span 3;background:var(--sea);border:1px solid var(--bd);border-radius:10px;overflow:hidden}
html,body{-webkit-tap-highlight-color:transparent}
.mapw,.mapw *,button{-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;outline:none}
input,select{-webkit-user-select:text;user-select:text}
.mapw polygon:active{filter:brightness(1.2)}.sm{font-size:12px;padding:3px 10px}.sk{margin-top:6px;font-size:13px}
.mapw svg{width:100%;height:100%;display:block}
.ct{opacity:var(--k,1);transition:opacity .35s}.cn{opacity:var(--c,0);transition:opacity .35s;pointer-events:none}
.sea{fill:var(--mut);font-style:italic;letter-spacing:4px;text-anchor:middle}
.mod{position:fixed;inset:0;background:rgba(5,15,20,.5);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:5;padding:12px;box-sizing:border-box}
.mc{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px 22px;min-width:min(340px,86vw);max-width:min(520px,92vw);max-height:92%;overflow:auto;box-shadow:0 18px 50px rgba(0,0,0,.45)}
.mc.an{animation:pop .38s cubic-bezier(.2,1.35,.4,1)}
.mc .card{border:0;padding:0;margin:0 0 8px;background:transparent}.mc h3{font-size:19px}
.mc tr{animation:rowin .45s both}.mc tr:nth-child(2){animation-delay:.2s}.mc tr:nth-child(3){animation-delay:.4s}.mc tr:nth-child(4){animation-delay:.6s}.mc tr:nth-child(5){animation-delay:.8s}
.dock{grid-column:1;grid-row:2;max-height:38vh;overflow:auto;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 12px;box-sizing:border-box}.cf{position:fixed;inset:0;margin:auto;height:max-content;width:min(320px,92vw);z-index:5;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:12px 14px;box-shadow:0 14px 40px rgba(0,0,0,.45);animation:pop .3s;box-sizing:border-box;text-align:center}
.cft{font-size:17px;font-weight:bold}.cfv{display:flex;justify-content:space-around;margin:6px 0}.cfv small{display:block;color:var(--mut);font-size:12px}.cfv b{font-size:38px;line-height:1.1}
.cfs{display:flex;align-items:center;justify-content:center;gap:14px}.cfs button{min-width:46px}.cfnn{font-size:46px;min-width:80px;line-height:1.1}.cfnn.w{color:#22a35a}.cfnn.l{color:#d0453a}.cf input[type=range]{width:100%;padding:0;margin:6px 0}.cfv b.w{color:#22a35a}.cfv b.l{color:#d0453a}

.cfb button{min-width:120px;font-size:17px}
.dock .card{border:0;background:transparent;padding:0;margin:0 0 4px}.dock h3{font-size:15px;margin:0 0 4px}.dkt{font-size:13px;color:var(--mut);margin-inline-end:8px}
#setm{z-index:8}
.tool{display:flex;gap:6px;justify-content:center;align-items:center;position:relative}.tool button{width:46px;height:40px;padding:0;margin:0;font-size:21px;line-height:1}.cts{display:contents}.mapw .mv{position:absolute;inset:0}.qb{text-align:center}.qb b{font-size:36px}.qb input{flex:1;width:auto;padding:0;margin:4px 0}.qbs{display:flex;align-items:center;gap:6px}.qbs button{min-width:46px;height:42px;font-size:22px}.qbr{display:flex;justify-content:space-between;color:var(--mut);font-size:12px}
.rxp{position:absolute;inset-inline-start:0;top:100%;margin-top:4px;display:grid;grid-template-columns:repeat(4,40px);gap:4px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:6px;z-index:4;box-shadow:0 8px 24px rgba(0,0,0,.35)}.rxp button{width:40px;height:40px;padding:0;margin:0;font-size:24px;background:transparent;border:0}
.rxs{position:absolute;left:8px;bottom:8px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;gap:3px;pointer-events:none;z-index:3;direction:ltr;max-height:62%;overflow:hidden}
.rxb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--fg);text-shadow:0 0 4px var(--bg),0 0 2px var(--bg);animation:rxin .35s both,rxout .6s both;direction:ltr}.rxb span{font-size:24px}.rxb u{text-decoration:none;font-size:14px}.rxb i{font-style:normal;font-size:12px}
.qflash{position:fixed;inset:0;z-index:15;pointer-events:none;background:var(--ac);opacity:0;animation:qf .9s ease 2}
@keyframes qf{0%,100%{opacity:0}40%{opacity:.35}}@keyframes rxin{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}@keyframes rxout{from{opacity:1}to{opacity:0;transform:translateY(-10px)}}#helpm{z-index:9}.hlp{max-height:86vh;overflow:auto;text-align:start}.hlp h4{margin:10px 0 2px;color:var(--ac)}.hlp p,.hlp li{font-size:14px;margin:2px 0}.hlp ol,.hlp ul{margin:2px 0;padding-inline-start:20px}
.spl{position:fixed;left:50%;bottom:9%;z-index:9;pointer-events:none;text-align:center;padding:10px 32px;border-radius:40px;background:var(--pc);color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:spl 1.9s ease both;display:flex;flex-direction:column}
.spl b{font-size:22px}.spl span{font-size:13px;opacity:.92}

@keyframes rowin{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}

button.s{background:transparent;color:var(--ac);border:1px solid var(--ac)}

.pr{border:2px solid var(--bd);border-radius:8px;padding:3px 8px;margin-bottom:4px;font-size:13px;background:var(--card)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:5px}
.msg{color:var(--ac);font-weight:bold}
.t{paint-order:stroke;stroke:#000;stroke-opacity:.6;stroke-width:3px;fill:#fff;text-anchor:middle;pointer-events:none;font-family:Tahoma,sans-serif}

}
@media(prefers-reduced-motion:reduce){}

<h4>الفكرة</h4><p>جيوشك تأتيك من معرفتك: تجيب عن أسئلة رقمية فتكسب جيوشاً، ثم تستخدمها لتحتل الخريطة. لا نرد ولا حظ.</p>

<h4>اللعب الأونلاين</h4><p>المضيف ينشئ غرفة بكود ويُرسله للاعبين (حتى 8 لاعبين). اللعبة تُحفظ تلقائياً فتعود كما كانت بعد تحديث الصفحة. وللمضيف زر 🤖 لتحويل لاعب منقطع إلى حاسوب بمستوى يختاره ثم 👤 لإعادته، وزر 👑 لنقل الاستضافة إلى لاعب آخر. يمكن لكل لاعب كتابة اسمه (يظهر مع بطاقته وفي الرسائل، ويظهر اسمه الأول مع التعليقات). في الإعدادات «حركة الكاميرا التلقائية»: خفيفة تقرّب من المنطقة التي تضغطها (مع كل المناطق المجاورة لها) إذا كانت صغيرة أو خارج الشاشة، وكاملة تتبع كل هجوم وحركة للاعبين الآخرين ثم تعود للنظرة العامة. وقبل البدء اختر «نطاق الخريطة» (كل الدول أو مجموعة منها أو دول تختارها) و«تفصيل المدن»: سهل مدينة لكل دولة، متوسط مدينتان، صعب كل المدن. ويضبط الهدف نفسه تلقائياً على حجم الخريطة، وتحتاج الخريطة إلى 4 مناطق لكل لاعب على الأقل. وفي نهاية اللعبة زر «جولة جديدة بنفس اللاعبين» عند المضيف (أو في اللعب المحلي) يعيد البدء بنفس الإعدادات والأسماء. وفي غرفة المضيف زر «مشاركة رابط الدعوة» يرسل رابطاً يدخل منه اللاعب مباشرة إلى الغرفة (يعمل إذا كانت اللعبة مستضافة على موقع). وإذا انقطع اتصال لاعب وهو مطلوب منه حركة ولم يتحرك 10 ثوانٍ، يلعب الحاسوب مكانه فوراً (وتظهر عليه علامة 🔌) ثم يعود إليه التحكم تلقائياً عند رجوعه. وللمضيف زر 👑 ثابت في شريط الأدوات تحت الخريطة يفتح قائمة بالمتصلين لاختيار المضيف الجديد. وإذا انقطع اتصالك أو حدّثت الصفحة تظهر نافذة «جارٍ الرجوع إلى اللعبة» وتعود تلقائياً إلى لعبة المضيف نفسها بدورها الحالي (ويُلغى تحويلك إلى حاسوب إن كنت قد غبت)، ولا تلعب على نسخة قديمة. ولا يتولى أحد الاستضافة إلا إذا تأكد أن المضيف غاب فعلاً، وإذا حدث خطأ عند المضيف يظهر له زر نقل الاستضافة.</p>
